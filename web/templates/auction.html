{% extends "app_layout.html" %}
{% block main %}
<h2>拍賣所</h2>
<p class="auction-lead">你可以在這裡競標商品。如果想要建立你的競標，請使用/create_bid 指令。<br>若剩餘時間低於 60 秒後有人出價，系統將自動延長 30 秒。</p>

<section class="auction-section">
  <h3>進行中的競標</h3>
  <div id="auction-active" class="auction-list">
    <p class="auction-empty">載入中…</p>
  </div>
</section>

<section class="auction-section">
  <h3>已結束的競標</h3>
  <div id="auction-ended" class="auction-list">
    <p class="auction-empty">載入中…</p>
  </div>
</section>
{% endblock %}
{% block extra_script %}
<div id="auction-toast" class="auction-toast" role="status"></div>
<div class="dialog-backdrop" id="cancel-dialog" role="dialog" aria-modal="true" aria-labelledby="cancel-dialog-title">
  <div class="dialog-card">
    <h3 id="cancel-dialog-title">確認撤銷競標</h3>
    <p>確定要撤銷這個競標嗎？所有人的蛋糕將會歸還，且無法復原。</p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-outline btn-sm" id="cancel-dialog-close">取消</button>
      <button type="button" class="btn btn-danger btn-sm" id="cancel-dialog-confirm">確認撤銷</button>
    </div>
  </div>
</div>
<script>
  (function () {
    var activeBox = document.getElementById("auction-active");
    var endedBox = document.getElementById("auction-ended");
    var toastBox = document.getElementById("auction-toast");
    var cakeBox = document.getElementById("topbar-cake");
    var cancelDialog = document.getElementById("cancel-dialog");
    var cancelDialogClose = document.getElementById("cancel-dialog-close");
    var cancelDialogConfirm = document.getElementById("cancel-dialog-confirm");
    var biddingIds = {};
    var cancellingIds = {};
    var pendingCancelId = 0;
    var lastSnapshot = { cake: 0, active: [], ended: [], permissions: {} };
    var toastHideTimer = null;
    var toastOutTimer = null;
    var reconnectTimer = null;
    var socket = null;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatSpan(seconds) {
      seconds = Math.max(0, seconds);
      var hours = Math.floor(seconds / 3600);
      var minutes = Math.floor((seconds % 3600) / 60);
      var secs = seconds % 60;
      var hourText = hours > 0 ? String(hours).padStart(2, "0") + ":" : "";
      return hourText + String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
    }

    function remainingFromIso(isoText) {
      var endMs = Date.parse(isoText);
      if (isNaN(endMs)) return 0;
      return Math.floor((endMs - Date.now()) / 1000);
    }

    function cakeIcon() {
      return '<img class="cake-icon" src="/static/cake.png" alt="蛋糕">';
    }

    function formatServerText(value) {
      return String(value).split(/<:cake:\d+>/).map(escapeHtml).join(cakeIcon());
    }

    function showToast(ok, messageHtml) {
      if (!toastBox) return;
      if (toastHideTimer) clearTimeout(toastHideTimer);
      if (toastOutTimer) clearTimeout(toastOutTimer);
      toastBox.innerHTML = messageHtml;
      toastBox.className = "auction-toast " + (ok ? "is-ok" : "is-error");
      void toastBox.offsetWidth;
      toastBox.classList.add("is-in");
      toastHideTimer = setTimeout(function () {
        toastBox.classList.remove("is-in");
        toastBox.classList.add("is-out");
        toastOutTimer = setTimeout(function () {
          toastBox.className = "auction-toast";
          toastBox.innerHTML = "";
        }, 400);
      }, 2400);
    }

    function updateCake(cake) {
      if (cakeBox && cake !== undefined && cake !== null) {
        cakeBox.innerHTML = cakeIcon() + " " + cake;
      }
    }

    function applySnapshot(data) {
      lastSnapshot = data || lastSnapshot;
      updateCake(lastSnapshot.cake);
      renderActive(lastSnapshot.active || []);
      renderEnded(lastSnapshot.ended || []);
    }

    function renderActive(items) {
      if (!items || !items.length) {
        activeBox.innerHTML = '<p class="auction-empty">目前沒有進行中的競標</p>';
        return;
      }
      activeBox.innerHTML = items.map(function (item) {
        var started = !!item.started;
        var remaining = started ? remainingFromIso(item.end_time) : remainingFromIso(item.start_time);
        var timeLabel = started ? "剩餘時間" : "開始倒數";
        var highest = item.highest_bidder_name
          ? item.highest_bid + cakeIcon() + "（" + escapeHtml(item.highest_bidder_name) + "）"
          : "尚無";
        var canBid = started && !item.is_highest_bidder && remaining > 0 && !biddingIds[item.id];
        var canCancel = !!(lastSnapshot.permissions && lastSnapshot.permissions.auction_cancel);
        var bidInner = "尚未開始";
        if (biddingIds[item.id]) {
          bidInner = "處理中…";
        } else if (item.is_highest_bidder) {
          bidInner = "你已是最高出價者";
        } else if (started) {
          bidInner = "出價 " + item.next_price + cakeIcon();
        }
        var cancelInner = cancellingIds[item.id] ? "處理中…" : "撤銷競標";
        var cancelButton = canCancel
          ? '<button type="button" class="btn btn-danger btn-sm btn-cancel-auction" data-id="' + item.id + '"' +
            (cancellingIds[item.id] ? " disabled" : "") + '>' + cancelInner + '</button>'
          : "";
        return (
          '<article class="auction-card" data-id="' + item.id + '">' +
            '<div class="auction-card-head">' +
              '<h4>' + escapeHtml(item.item) + '</h4>' +
              '<span class="auction-id">ID:' + item.id + '</span>' +
            '</div>' +
            '<p class="auction-time">' + timeLabel + ' <strong>' + formatSpan(remaining) + '</strong></p>' +
            '<dl class="auction-meta">' +
              '<div><dt>發起人</dt><dd>' + escapeHtml(item.author_name) + '</dd></div>' +
              '<div><dt>起標價</dt><dd>' + item.start_price + cakeIcon() + '</dd></div>' +
              '<div><dt>增額出價</dt><dd>' + item.increment + cakeIcon() + '</dd></div>' +
              '<div><dt>目前最高價</dt><dd>' + highest + '</dd></div>' +
              '<div><dt>出價次數</dt><dd>' + item.bid_count + '</dd></div>' +
            '</dl>' +
            '<div class="auction-card-foot">' +
              '<button type="button" class="btn btn-bid" data-id="' + item.id + '" data-price="' + item.next_price + '"' +
                (canBid ? "" : " disabled") + '>' + bidInner + '</button>' +
              cancelButton +
            '</div>' +
          '</article>'
        );
      }).join("");
    }

    function renderEnded(items) {
      if (!items || !items.length) {
        endedBox.innerHTML = '<p class="auction-empty">目前沒有已結束的競標</p>';
        return;
      }
      endedBox.innerHTML = items.map(function (item) {
        var result = item.cancelled
          ? "競標已取消"
          : item.highest_bidder_name
            ? escapeHtml(item.highest_bidder_name) + " 以 " + item.highest_bid + cakeIcon() + " 得標"
            : "流標";
        return (
          '<article class="auction-card is-ended">' +
            '<div class="auction-card-head">' +
              '<h4>' + escapeHtml(item.item) + '</h4>' +
              '<span class="auction-id">ID:' + item.id + '</span>' +
            '</div>' +
            '<dl class="auction-meta">' +
              '<div><dt>發起人</dt><dd>' + escapeHtml(item.author_name) + '</dd></div>' +
              '<div><dt>結果</dt><dd>' + result + '</dd></div>' +
              '<div><dt>出價次數</dt><dd>' + item.bid_count + '</dd></div>' +
            '</dl>' +
          '</article>'
        );
      }).join("");
    }

    function openCancelDialog(auctionId) {
      pendingCancelId = auctionId;
      if (cancelDialog) cancelDialog.classList.add("is-open");
    }

    function closeCancelDialog() {
      pendingCancelId = 0;
      if (cancelDialog) cancelDialog.classList.remove("is-open");
    }

    async function cancelAuction(auctionId) {
      cancellingIds[auctionId] = true;
      applySnapshot(lastSnapshot);
      try {
        var response = await fetch("/api/auction/cancel", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ auction_id: auctionId })
        });
        var data = await response.json();
        updateCake(data.cake);
        if (data.ok) {
          showToast(true, "已撤銷競標，全部出價蛋糕已歸還");
        } else {
          showToast(false, "撤銷失敗:" + formatServerText(data.error || "未知錯誤"));
        }
      } catch (error) {
        showToast(false, "撤銷失敗:系統忙碌，請稍後再試");
      }
      delete cancellingIds[auctionId];
      applySnapshot(lastSnapshot);
    }

    async function placeBid(auctionId, expectedPrice) {
      biddingIds[auctionId] = true;
      applySnapshot(lastSnapshot);
      try {
        var response = await fetch("/api/auction/bid", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ auction_id: auctionId, expected_price: expectedPrice })
        });
        var data = await response.json();
        updateCake(data.cake);
        if (data.ok) {
          showToast(true, "出價成功：你以 " + data.price + cakeIcon() + " 出價");
        } else {
          showToast(false, "出價失敗:" + formatServerText(data.error || "未知錯誤"));
        }
      } catch (error) {
        showToast(false, "出價失敗:系統忙碌，請稍後再試");
      }
      delete biddingIds[auctionId];
      applySnapshot(lastSnapshot);
    }

    function connectSocket() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      var protocol = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(protocol + "//" + location.host + "/ws/auction");
      socket.onmessage = function (event) {
        try {
          applySnapshot(JSON.parse(event.data));
        } catch (error) {
          return;
        }
      };
      socket.onclose = function (event) {
        if (event.code === 4401 || event.code === 4403) {
          location.href = "/";
          return;
        }
        reconnectTimer = setTimeout(connectSocket, 2000);
      };
    }

    activeBox.addEventListener("click", function (event) {
      var cancelButton = event.target.closest(".btn-cancel-auction");
      if (cancelButton) {
        if (cancelButton.disabled) return;
        var cancelId = parseInt(cancelButton.getAttribute("data-id"), 10);
        if (!cancelId) return;
        openCancelDialog(cancelId);
        return;
      }
      var button = event.target.closest(".btn-bid");
      if (!button || button.disabled) return;
      var auctionId = parseInt(button.getAttribute("data-id"), 10);
      var expectedPrice = parseInt(button.getAttribute("data-price"), 10);
      if (!auctionId || !expectedPrice) return;
      placeBid(auctionId, expectedPrice);
    });

    if (cancelDialog && cancelDialogClose && cancelDialogConfirm) {
      cancelDialogClose.addEventListener("click", closeCancelDialog);
      cancelDialog.addEventListener("click", function (event) {
        if (event.target === cancelDialog) closeCancelDialog();
      });
      cancelDialogConfirm.addEventListener("click", function () {
        var auctionId = pendingCancelId;
        closeCancelDialog();
        if (auctionId) cancelAuction(auctionId);
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && cancelDialog.classList.contains("is-open")) {
          closeCancelDialog();
        }
      });
    }

    connectSocket();
  })();
</script>
{% endblock %}
