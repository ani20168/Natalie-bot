{% extends "app_layout.html" %}
{% block main %}
<div class="shop-page-head">
  <div>
    <h2>Juice Battle 爬塔後台</h2>
    <p class="shop-lead">勾選裝備後會平均分配掉落機率；未設定的 5 倍數樓層會使用通用掉落池。</p>
  </div>
</div>

<section class="shop-admin-card">
  <div class="encounter-card-head">
    <h3>通用掉落池</h3>
    <button type="button" class="btn btn-bid btn-sm" id="tower-settings-save">儲存設定</button>
  </div>
  <p class="encounter-hint">5、10、15 等樓層沒有專屬設定時，會從這裡勾選的裝備中平均抽取。全部取消勾選代表不掉落裝備。</p>
  <div id="tower-default-pool" class="tower-equipment-grid"></div>
</section>

<section class="shop-admin-card">
  <div class="encounter-card-head">
    <h3>指定樓層掉落池</h3>
    <button type="button" class="btn btn-outline btn-sm" id="tower-floor-add">新增樓層</button>
  </div>
  <p class="encounter-hint">可設定正的 5 倍數樓層，例如 5、10、15。指定樓層即使沒有勾選任何裝備，也不會回退到通用掉落池。</p>
  <div id="tower-floor-pools"></div>
</section>
{% endblock %}

{% block extra_script %}
<div id="tower-settings-toast" class="auction-toast" role="status"></div>
<script>
  (function () {
    var equipment = [];
    var pools = { default: [] };
    var defaultBox = document.getElementById("tower-default-pool");
    var floorsBox = document.getElementById("tower-floor-pools");
    var toastBox = document.getElementById("tower-settings-toast");
    var saveButton = document.getElementById("tower-settings-save");
    var addButton = document.getElementById("tower-floor-add");
    var toastHideTimer = null;
    var toastOutTimer = null;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showToast(ok, message) {
      if (!toastBox) return;
      if (toastHideTimer) clearTimeout(toastHideTimer);
      if (toastOutTimer) clearTimeout(toastOutTimer);
      toastBox.textContent = message;
      toastBox.className = "auction-toast " + (ok ? "is-ok" : "is-error");
      void toastBox.offsetWidth;
      toastBox.classList.add("is-in");
      toastHideTimer = setTimeout(function () {
        toastBox.classList.remove("is-in");
        toastBox.classList.add("is-out");
        toastOutTimer = setTimeout(function () {
          toastBox.className = "auction-toast";
          toastBox.textContent = "";
        }, 400);
      }, 2400);
    }

    function equipmentLabel(item) {
      var kind = item.kind === "weapon" ? "武器" : "防具";
      var stats = "HP" + item.hp_offset + "｜攻擊" + item.atk_offset +
        "｜防禦" + item.def_offset + "｜敏捷" + item.agi_offset;
      var ability = item.ability && item.ability.name ? "｜" + item.ability.name : "";
      return "<strong>" + escapeHtml(item.name) + "</strong><small>" +
        escapeHtml(kind + "｜" + stats + ability) + "</small>";
    }

    function isChecked(pool, itemId) {
      return (pools[pool] || []).indexOf(itemId) >= 0;
    }

    function renderPool(pool, box) {
      if (!box) return;
      box.innerHTML = equipment.map(function (item) {
        var checked = isChecked(pool, item.item_id) ? " checked" : "";
        return "<label class=\"tower-equipment-option\">" +
          "<input type=\"checkbox\" data-pool=\"" + escapeHtml(pool) +
          "\" data-item-id=\"" + escapeHtml(item.item_id) + "\"" + checked + ">" +
          "<span>" + equipmentLabel(item) + "</span></label>";
      }).join("");
    }

    function renderFloors() {
      var keys = Object.keys(pools).filter(function (key) { return key !== "default"; });
      keys.sort(function (left, right) { return parseInt(left, 10) - parseInt(right, 10); });
      if (!keys.length) {
        floorsBox.innerHTML = "<p class=\"encounter-empty\">尚未設定指定樓層。</p>";
        return;
      }
      floorsBox.innerHTML = keys.map(function (floor) {
        return "<section class=\"tower-floor-pool\" data-floor=\"" + escapeHtml(floor) + "\">" +
          "<div class=\"encounter-card-head\"><h4>第 " + escapeHtml(floor) + " 層</h4>" +
          "<button type=\"button\" class=\"btn btn-danger btn-sm tower-floor-remove\">移除</button></div>" +
          "<div class=\"tower-equipment-grid\" data-pool-box=\"" + escapeHtml(floor) + "\"></div></section>";
      }).join("");
      keys.forEach(function (floor) {
        renderPool(floor, floorsBox.querySelector("[data-pool-box='" + floor + "']"));
      });
    }

    function syncPools() {
      var nextPools = {};
      var defaultItems = [];
      defaultBox.querySelectorAll("input[type='checkbox']:checked").forEach(function (input) {
        defaultItems.push(input.getAttribute("data-item-id"));
      });
      nextPools.default = defaultItems;
      floorsBox.querySelectorAll(".tower-floor-pool").forEach(function (row) {
        var floor = row.getAttribute("data-floor");
        var selected = [];
        row.querySelectorAll("input[type='checkbox']:checked").forEach(function (input) {
          selected.push(input.getAttribute("data-item-id"));
        });
        nextPools[floor] = selected;
      });
      pools = nextPools;
    }

    addButton.addEventListener("click", function () {
      syncPools();
      var value = window.prompt("請輸入正的 5 倍數樓層，例如 5");
      var floor = parseInt(value, 10);
      if (!floor || floor < 5 || floor % 5 !== 0 || pools[String(floor)]) {
        if (value !== null) showToast(false, "樓層必須是尚未設定的正 5 倍數");
        return;
      }
      pools[String(floor)] = [];
      renderFloors();
    });

    floorsBox.addEventListener("click", function (event) {
      var button = event.target.closest(".tower-floor-remove");
      if (!button) return;
      syncPools();
      var row = button.closest(".tower-floor-pool");
      delete pools[row.getAttribute("data-floor")];
      renderFloors();
    });

    saveButton.addEventListener("click", async function () {
      syncPools();
      saveButton.disabled = true;
      try {
        var response = await fetch("/api/juice-battle/tower/settings", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ drop_pools: pools })
        });
        var data = await response.json();
        if (!data.ok) {
          showToast(false, data.error || "儲存失敗");
          return;
        }
        equipment = data.equipment || equipment;
        pools = data.drop_pools || { default: [] };
        renderPool("default", defaultBox);
        renderFloors();
        showToast(true, data.message || "已儲存設定");
      } catch (error) {
        showToast(false, "儲存失敗，請稍後再試");
      } finally {
        saveButton.disabled = false;
      }
    });

    async function loadAdmin() {
      try {
        var response = await fetch("/api/juice-battle/tower/admin", { credentials: "same-origin" });
        var data = await response.json();
        if (!data.ok) {
          showToast(false, data.error || "載入失敗");
          return;
        }
        equipment = data.equipment || [];
        pools = data.drop_pools || { default: [] };
        renderPool("default", defaultBox);
        renderFloors();
      } catch (error) {
        showToast(false, "載入失敗，請稍後再試");
      }
    }

    loadAdmin();
  })();
</script>
{% endblock %}
